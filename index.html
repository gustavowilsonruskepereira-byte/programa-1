<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apresentação do Gustavo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e8f0ff;

            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        main {
            background: #ffffff;
            max-width: 760px;
            width: 90%;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.12);
        }
        h1 {
            margin-top: 0;
            color: #0f3d91;
        }
        p {
            line-height: 1.6;
            font-size: 1rem;
        }
        a.button {
            display: inline-block;
            margin-top: 24px;
            padding: 16px 26px;
            background: #0f3d91;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main>
        <h1>Olá! Eu sou o Gustavo</h1>
        <p>Eu sou um ótimo aluno com ótimas notas. Gosto de estudar e de aprender sempre mais.</p>
        <p>Este site é a minha página de apresentação, e mostra que sou responsável, dedicado e curioso.</p>
        <a class="button" href="games.html">Ir para minha sala de jogos</a>
