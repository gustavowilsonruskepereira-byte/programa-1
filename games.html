<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala de Jogos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(145deg, #0f3d91, #11256b);
            color: #f4f4f8;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        main {
            background: rgba(10, 25, 64, 0.95);
            max-width: 900px;
            width: 95%;
            padding: 34px;
            border-radius: 22px;
            box-shadow: 0 28px 70px rgba(0,0,0,0.35);
        }
        h1 {
            margin-top: 0;
            color: #ffffff;
        }
        p {
            line-height: 1.7;
            color: #d6dcef;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 22px;
            margin-top: 30px;
        }
        .card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 20px;
            padding: 26px;
            transition: transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 24px 45px rgba(0,0,0,0.22);
            border-color: rgba(255,255,255,0.28);
        }
        .card a {
            color: inherit;
            text-decoration: none;
        }
        .card h2 {
            margin: 0 0 14px;
            font-size: 1.5rem;
            letter-spacing: 0.01em;
        }
        .card p {
            margin: 0;
            color: #cfdafb;
            line-height: 1.6;
        }
        .card .cta {
            margin-top: 20px;
            display: inline-block;
            background: #ffce00;
            color: #102047;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: bold;
        }
        .footer {
            text-align: center;
            margin-top: 34px;
        }
        .footer a {
            display: inline-block;
            margin-top: 14px;
            padding: 14px 24px;
            background: #1b73e8;
            color: white;
            text-decoration: none;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Minha Sala de Jogos</h1>
        <p>Seja bem-vindo! Aqui você verá os jogos mais legais que eu estou criando. Cada cartão representa um jogo diferente.</p>
        <div class="cards">
            <article class="card">
                <a href="games/casino.html">
                    <div>
                        <h2>Jogo do Cassino</h2>
                        <p>Comece pelo primeiro jogo da sala: um cassino estilizado com cartas, fichas e muita diversão.</p>
                    </div>
                    <span class="cta">Entrar no cassino</span>
                </a>
            </article>
        </div>
        <div class="footer">
            <a href="index.html">Voltar para a página principal</a>
        </div>
    </main>
</body>
</html>
